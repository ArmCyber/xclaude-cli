name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.15.0", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install tmux and zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: Install tmux
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm ci
      - run: npm run check
      - name: Spike 9 (process.execve on this Node)
        run: node spikes/spike9-execve.mjs
